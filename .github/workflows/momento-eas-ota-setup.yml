name: Configure Momento EAS OTA and start signed APK build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/momento-eas-ota-setup.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: momento-eas-ota-setup
  cancel-in-progress: false

jobs:
  configure:
    name: Link Expo project, enable OTA, publish update and start APK build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify required secrets
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN" || { echo "::error::EXPO_TOKEN is missing."; exit 1; }
          test -n "$EXPO_PUBLIC_FIREBASE_API_KEY" || { echo "::error::EXPO_PUBLIC_FIREBASE_API_KEY is missing."; exit 1; }

      - name: Compile translation catalogs
        run: pnpm intl:compile

      - name: Confirm the created Momento EAS project
        id: eas
        run: |
          set -euo pipefail
          echo "project_id=e71ea555-01a7-48bb-aae5-0191c538481d" >> "$GITHUB_OUTPUT"
          echo "Confirmed @kuldeep-vermas-team/momento (EAS project e71ea555-01a7-48bb-aae5-0191c538481d)."

      - name: Enable EAS Update in Momento app config
        env:
          EAS_PROJECT_ID: ${{ steps.eas.outputs.project_id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'app.config.js'
          const projectId = process.env.EAS_PROJECT_ID
          if (!projectId || !/^[0-9a-f-]{36}$/i.test(projectId)) {
            throw new Error('EAS project ID is missing or invalid.')
          }
          let source = fs.readFileSync(path, 'utf8')
          const anchor = "  const USE_SENTRY = Boolean(process.env.SENTRY_AUTH_TOKEN)\n"
          if (!source.includes('const EAS_PROJECT_ID =')) {
            if (!source.includes(anchor)) throw new Error('Could not find the app-config insertion point.')
            source = source.replace(anchor, anchor + "  const EAS_PROJECT_ID = '" + projectId + "'\n")
          } else {
            source = source.replace(/const EAS_PROJECT_ID = ['"][^'"]*['"]/, "const EAS_PROJECT_ID = '" + projectId + "'")
          }
          if (!source.includes("owner: 'kuldeep-vermas-team'")) {
            source = source.replace("      slug: 'momento',\n", "      slug: 'momento',\n      owner: 'kuldeep-vermas-team',\n")
          }
          const oldUpdates = /      updates: \{\n        enabled: false,\n        fallbackToCacheTimeout: 30000,\n        checkAutomatically: 'NEVER',\n      \},/
          const newUpdates = [
            '      updates: {',
            '        enabled: true,',
            '        url: `https://u.expo.dev/${EAS_PROJECT_ID}`,',
            '        fallbackToCacheTimeout: 0,',
            "        checkAutomatically: 'ON_LOAD',",
            '        requestHeaders: {',
            "          'expo-channel-name': 'production',",
            '        },',
            '      },',
          ].join('\n')
          if (oldUpdates.test(source)) {
            source = source.replace(oldUpdates, newUpdates)
          } else if (!source.includes("url: `https://u.expo.dev/${EAS_PROJECT_ID}`")) {
            throw new Error('The expected existing updates block changed; refusing to overwrite it blindly.')
          }
          const easAnchor = '      extra: {\n        eas: {\n'
          if (!source.includes('projectId: EAS_PROJECT_ID')) {
            if (!source.includes(easAnchor)) throw new Error('Could not find extra.eas in app config.')
            source = source.replace(easAnchor, easAnchor + '          projectId: EAS_PROJECT_ID,\n')
          }
          fs.writeFileSync(path, source)
          NODE

      - name: Verify resolved Expo configuration
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
        run: |
          set -euo pipefail
          pnpm exec expo config --type public --json > "$RUNNER_TEMP/expo-config.json"
          node <<'NODE'
          const fs = require('node:fs')
          const root = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/expo-config.json', 'utf8'))
          const c = root.expo || root
          const id = c.extra?.eas?.projectId
          if (!id || c.updates?.url !== 'https://u.expo.dev/' + id) throw new Error('EAS project ID and updates URL do not match.')
          if (c.updates?.enabled !== true) throw new Error('Expo Updates is not enabled.')
          if (c.updates?.requestHeaders?.['expo-channel-name'] !== 'production') throw new Error('Production update channel is not configured.')
          if (c.android?.package !== 'com.kuldeep.momento') throw new Error('Android package name changed unexpectedly.')
          if (!c.runtimeVersion) throw new Error('Runtime version is missing.')
          console.log('Verified EAS project ' + id + ', production channel, appVersion runtime, and Android package.')
          NODE

      - name: Generate Android native project and verify OTA metadata
        env:
          EAS_PROJECT_ID: ${{ steps.eas.outputs.project_id }}
          CI: "1"
          EXPO_NO_GIT_STATUS: "1"
          EAS_PROJECT_ID: ${{ steps.eas.outputs.project_id }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
        run: |
          set -euo pipefail
          pnpm exec expo prebuild --platform android --clean --no-install
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          test -s "$MANIFEST"
          grep -Fq "https://u.expo.dev/$EAS_PROJECT_ID" "$MANIFEST"
          grep -Fq "expo.modules.updates.UPDATES_CONFIGURATION_REQUEST_HEADERS_KEY" "$MANIFEST"
          grep -Fq "expo-channel-name" "$MANIFEST"
          echo "Android native project contains the EAS update URL and production channel metadata."

      - name: Publish initial Android OTA update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
        run: pnpm dlx eas-cli@latest update --channel production --platform android --message "Momento initial OTA setup" --non-interactive

      - name: Add automatic OTA workflow and commit EAS configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .github/workflows
          cat > .github/workflows/momento-ota-update.yml <<'EOF'
          name: Publish Momento production OTA update

          on:
            push:
              branches:
                - main
              paths-ignore:
                - '.github/**'
                - 'android/**'
                - 'ios/**'
                - 'app.config.js'
                - 'eas.json'
                - 'package.json'
                - 'pnpm-lock.yaml'
                - 'google-services.json'
                - 'modules/**'
                - 'plugins/**'
                - 'patches/**'
                - 'scripts/**'
                - 'babel.config.js'
                - 'metro.config.js'
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: momento-production-ota
            cancel-in-progress: false

          jobs:
            publish:
              name: Bundle and publish Android OTA update
              runs-on: ubuntu-latest
              timeout-minutes: 45
              steps:
                - name: Checkout
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

                - name: Setup pnpm
                  uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
                  with:
                    version: 11.28.5
                    run_install: false

                - name: Setup Node.js
                  uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
                  with:
                    node-version: 24.22.1
                    cache: pnpm

                - name: Install dependencies
                  run: pnpm install --frozen-lockfile

                - name: Compile translations
                  run: pnpm intl:compile

                - name: Verify EAS configuration
                  run: |
                    set -euo pipefail
                    pnpm exec expo config --type public --json > "$RUNNER_TEMP/expo-config.json"
                    node -e "const c=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/expo-config.json','utf8')); const x=c.expo||c; if(!x.extra?.eas?.projectId || x.updates?.enabled!==true || x.updates?.requestHeaders?.['expo-channel-name']!=='production') process.exit(1)"

                - name: Publish Android OTA update
                  env:
                    EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
                    EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
                  run: pnpm dlx eas-cli@latest update --channel production --platform android --message "Momento OTA ${{ github.sha }}" --non-interactive
          EOF
          # The OTA workflow intentionally ignores this initial configuration commit.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.config.js .github/workflows/momento-ota-update.yml
          if git diff --cached --quiet; then
            echo "No configuration changes to commit."
          else
            git commit -m "Configure Momento EAS OTA updates"
            git push origin HEAD:main
          fi

      - name: Start signed release APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run momento-android-apk.yml --ref main
          echo "## OTA setup" >> "$GITHUB_STEP_SUMMARY"
          echo "- EAS project: $EAS_PROJECT_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- OTA channel: production (Android)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Initial OTA update: published" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signed APK build: dispatched" >> "$GITHUB_STEP_SUMMARY"
