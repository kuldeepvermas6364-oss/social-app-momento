name: Publish Momento production OTA update

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - 'android/**'
      - 'ios/**'
      - 'app.config.js'
      - 'eas.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'google-services.json'
      - 'modules/**'
      - 'plugins/**'
      - 'patches/**'
      - 'scripts/**'
      - 'babel.config.js'
      - 'metro.config.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: momento-production-ota
  cancel-in-progress: false

jobs:
  publish:
    name: Bundle and publish Android OTA update
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile translations
        run: pnpm intl:compile

      - name: Verify EAS configuration
        run: |
          set -euo pipefail
          pnpm exec expo config --type public --json > "$RUNNER_TEMP/expo-config.json"
          node -e "const c=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/expo-config.json','utf8')); const x=c.expo||c; if(!x.extra?.eas?.projectId || x.updates?.enabled!==true || x.updates?.requestHeaders?.['expo-channel-name']!=='production') process.exit(1)"

      - name: Publish Android OTA update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
        run: pnpm dlx eas-cli@latest update --channel production --environment production --platform android --message "Momento OTA ${{ github.sha }}" --non-interactive
