name: Build Momento Android debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "momento-v*"

permissions:
  contents: write

concurrency:
  group: momento-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Momento debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android native project
        env:
          CI: "1"
          EXPO_NO_GIT_STATUS: "1"
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Package APK
        id: package
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$SOURCE_APK"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            SUFFIX="${GITHUB_REF_NAME}"
          else
            SUFFIX="${GITHUB_SHA:0:7}"
          fi
          APK="Momento-${SUFFIX}-debug.apk"
          cp "$SOURCE_APK" "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Momento-debug-${{ github.sha }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/momento-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${{ steps.package.outputs.path }}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.path }}" \
              --title "Momento $GITHUB_REF_NAME (debug APK)" \
              --notes "Installable Momento test build. This debug-signed APK is for device testing and is not a Google Play production release." \
              --verify-tag
          fi

      - name: Write build summary
        run: |
          {
            echo "## Momento Android APK"
            echo
            echo "- Package: com.kuldeep.momento"
            echo "- Type: debug-signed test APK"
            echo "- File: ${{ steps.package.outputs.name }}"
            echo
            echo "This build is for direct device testing, not Google Play production publishing."
          } >> "$GITHUB_STEP_SUMMARY"
