name: Build Momento Android signed release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "momento-v*"

permissions:
  contents: write

concurrency:
  group: momento-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed Momento release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Firebase and Android release signing secrets
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$EXPO_PUBLIC_FIREBASE_API_KEY"
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Generate Android native project
        env:
          CI: "1"
          EXPO_NO_GIT_STATUS: "1"
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/momento-release.jks
          test -s android/app/momento-release.jks
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle")
          source = gradle.read_text()
          signing_block = """signingConfigs {
              release {
                  storeFile file("momento-release.jks")
                  storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("ANDROID_KEY_ALIAS")
                  keyPassword System.getenv("ANDROID_KEY_PASSWORD")
              }
          """
          if "release {\n        storeFile file(\"momento-release.jks\")" not in source:
              source, count = re.subn(r"signingConfigs\\s*\\{", signing_block, source, count=1)
              if count != 1:
                  raise SystemExit("Could not add the release signing configuration.")
          source, count = re.subn(
              r"(release\\s*\\{[\\s\\S]*?signingConfig\\s+)signingConfigs\\.debug",
              r"\\1signingConfigs.release",
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not switch the release build to the release signing key.")
          gradle.write_text(source)
          PY

      - name: Build signed release APK
        working-directory: android
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package release APK
        id: package
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$SOURCE_APK"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            SUFFIX="${GITHUB_REF_NAME}"
          else
            SUFFIX="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          fi
          APK="Momento-${SUFFIX}-release.apk"
          cp "$SOURCE_APK" "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Momento-release-${{ github.sha }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="momento-build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.package.outputs.path }}" --clobber
          else
            gh release create "$TAG" "${{ steps.package.outputs.path }}" \
              --target "$GITHUB_SHA" \
              --title "Momento signed Android release $TAG" \
              --notes "Signed release APK for package com.kuldeep.momento. Built from commit $GITHUB_SHA."
          fi

      - name: Write build summary
        run: |
          {
            echo "## Momento Android Release"
            echo
            echo "- Package: com.kuldeep.momento"
            echo "- Type: signed release APK"
            echo "- File: ${{ steps.package.outputs.name }}"
            echo "- GitHub Release: published"
          } >> "$GITHUB_STEP_SUMMARY"
