name: Momento Social App Checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "modules/**"
      - "lexicons/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - ".oxlintrc.json"
      - "scripts/**"
      - "src/locale/**"
      - ".github/workflows/momento-social-checks.yml"

permissions:
  contents: read

concurrency:
  group: momento-social-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Social app quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify live Firebase Email/Password configuration
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const apiKey = process.env.EXPO_PUBLIC_FIREBASE_API_KEY
          if (!apiKey) {
            throw new Error('Missing GitHub secret EXPO_PUBLIC_FIREBASE_API_KEY.')
          }

          const email = `momento-ci-smoke-${process.env.GITHUB_RUN_ID}@example.com`
          const response = await fetch(
            `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${encodeURIComponent(apiKey)}`,
            {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({
                email,
                password: 'momento-ci-invalid-password',
                returnSecureToken: true,
              }),
            },
          )
          const data = await response.json()
          const code = data?.error?.message
          const expectedRejections = new Set([
            'EMAIL_NOT_FOUND',
            'INVALID_PASSWORD',
            'INVALID_LOGIN_CREDENTIALS',
          ])

          if (response.status !== 400 || !expectedRejections.has(code)) {
            throw new Error(
              `Firebase Email/Password smoke check failed (HTTP ${response.status}, ${code ?? 'unknown error'}).`,
            )
          }

          console.log(
            'Firebase API key accepted and Email/Password sign-in is enabled; the deliberately invalid CI login was correctly rejected.',
          )
          NODE

      - name: Compile translation catalogs
        run: pnpm intl:compile

      - name: Verify generated AT Protocol lexicons
        run: pnpm lexicons:verify

      - name: Print actionable lint diagnostics
        id: lint
        continue-on-error: true
        run: |
          pnpm exec oxlint src modules
          node scripts/check-sentry-browser-version.mjs

      - name: Export lint diagnostics with file locations
        continue-on-error: true
        run: |
          pnpm exec oxlint --format json src modules > oxlint-diagnostics.json || true
          echo "--- JSON lint diagnostics ---"
          cat oxlint-diagnostics.json

      - name: Check formatting
        id: prettier
        continue-on-error: true
        run: pnpm prettier

      - name: Capture automatic import-sort and formatting fixes
        id: import_fixes
        continue-on-error: true
        run: |
          pnpm exec oxlint --fix src modules || true
          pnpm exec prettier --write feed-generator/src/index.js src/App.tsx src/lib/firebase/account.ts src/lib/firebase/auth.ts src/lib/firebase/database.ts src/lib/firebase/session.tsx src/view/com/auth/FirebaseAuthGate.tsx src/view/shell/createNativeStackNavigatorWithAuth.tsx src/lib/firebase/auth.test.ts src/lib/firebase/account.test.ts src/lib/api/feed/__tests__/utils.test.ts src/lib/api/feed/merge.test.ts src/lib/api/feed/custom.test.ts
          echo "--- formatter and import-sort diff ---"
          git diff -- src modules feed-generator/src/index.js

      - name: Run unit and component tests
        id: tests
        continue-on-error: true
        run: pnpm test-ci --runInBand

      - name: Typecheck Android
        id: android
        continue-on-error: true
        run: pnpm typecheck:android

      - name: Typecheck web
        id: web
        continue-on-error: true
        run: pnpm typecheck:web

      - name: Format Momento SVG files for review
        if: always()
        run: |
          pnpm exec prettier --write src/view/icons/Logomark.tsx src/view/icons/Logotype.tsx src/screens/VideoFeed/index.web.tsx
          echo "Momento icons and web Reels source formatted."
          cat src/view/icons/Logomark.tsx

      - name: Enforce quality gate
        if: always()
        env:
          LINT_RESULT: ${{ steps.lint.outcome }}
          PRETTIER_RESULT: ${{ steps.prettier.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          ANDROID_RESULT: ${{ steps.android.outcome }}
          WEB_RESULT: ${{ steps.web.outcome }}
        run: |
          printf 'lint=%s prettier=%s tests=%s android=%s web=%s\n' "$LINT_RESULT" "$PRETTIER_RESULT" "$TEST_RESULT" "$ANDROID_RESULT" "$WEB_RESULT"
          test "$LINT_RESULT" = "success"
          test "$PRETTIER_RESULT" = "success"
          test "$TEST_RESULT" = "success"
          test "$ANDROID_RESULT" = "success"
          test "$WEB_RESULT" = "success"

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Momento social app checks"
            echo
            echo "- Repository: kuldeepvermas6364-oss/social-app-momento"
            echo "- Branch: main"
            echo "- AT Protocol lexicons, lint, formatting, tests, Android and web types are checked."
            echo "- No backend or paid API secrets are required for these checks."
          } >> "$GITHUB_STEP_SUMMARY"
