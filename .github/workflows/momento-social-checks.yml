name: Momento Social App Checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "modules/**"
      - "lexicons/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - ".github/workflows/momento-social-checks.yml"

permissions:
  contents: read

concurrency:
  group: momento-social-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Social app quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated AT Protocol lexicons
        run: pnpm lexicons:verify

      - name: Lint application and native modules
        run: pnpm lint

      - name: Run unit and component tests
        run: pnpm test-ci --runInBand

      - name: Typecheck Android
        run: pnpm typecheck:android

      - name: Typecheck web
        run: pnpm typecheck:web

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Momento social app checks"
            echo
            echo "- Repository: `kuldeepvermas6364-oss/social-app-momento`"
            echo "- Branch: `main`"
            echo "- Android and web typechecks are run separately."
            echo "- No backend or paid API secrets are required for these checks."
          } >> "$GITHUB_STEP_SUMMARY"
